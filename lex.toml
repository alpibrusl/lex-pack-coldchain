[package]
name        = "lex-pack-coldchain"
version     = "0.1.0"
description = "Cold-chain domain pack — temperature-envelope declarations, reefer readings, and evidence-gated excursion pricing attributed to whoever held custody. Shares its custody data at the DATA level (the `events` table) with lex-pack-custody, not a code import."

[dependencies]
lex-soft   = { git = "https://github.com/alpibrusl/lex-soft" }
lex-trail  = { git = "https://github.com/alpibrusl/lex-trail" }
lex-web    = { git = "https://github.com/alpibrusl/lex-web" }
lex-schema = { git = "https://github.com/alpibrusl/lex-schema" }
lex-money  = { git = "https://github.com/alpibrusl/lex-money" }
lex-agent  = { git = "https://github.com/alpibrusl/lex-agent" }
lex-llm    = { git = "https://github.com/alpibrusl/lex-llm" }
lex-spec   = { git = "https://github.com/alpibrusl/lex-spec" }
